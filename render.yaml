services:
  - type: web
    name: shopflow
    runtime: node
    plan: starter
    buildCommand: rm -rf node_modules && npm ci
    startCommand: npm start
    healthCheckPath: /api/auth/status
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/shop.db
    disk:
      name: shopflow-data
      mountPath: /var/data
      sizeGB: 1
